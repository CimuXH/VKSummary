<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>获取环境变量教程</title>
  <style>
    body {
      margin: 0;
      padding: 32px 16px;
      background: #faf9f6;
      color: #292524;
      font-family: "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      line-height: 1.8;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    h1 {
      font-size: 22px;
      margin-top: 0;
    }
    ol {
      padding-left: 22px;
    }
    li {
      margin-bottom: 8px;
    }
    code {
      background: #f0efeb;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 14px;
    }
    .tip {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #9a3412;
      padding: 12px 16px;
      border-radius: 8px;
      margin-top: 16px;
      font-size: 14px;
    }
    img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 24px auto 0;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>如何获取 B 站 Cookie</h1>
    <ol>
      <li>随便打开一个 B 站视频页面</li>
      <li>打开浏览器控制台（按 <code>F12</code> 或 <code>Ctrl+Shift+I</code>）</li>
      <li>点击「应用程序 / Application」</li>
      <li>在左侧找到「Cookie」</li>
      <li>找到对应的值复制下来</li>
      <li>把复制到的值填写到环境变量配置中</li>
    </ol>
    <div class="tip">
      💡 需要获取的主要是 <code>sessdata</code>、<code>bili_jct</code>、<code>buvid3</code>。
    </div>
    <img src="/how_to_setenv.png" alt="获取环境变量教程图片" />
  </div>
</body>
</html>
