<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- 简约背景：右下角播放键 → 左上延伸节点图 -->

  <!-- 连接线 — 从右下播放键向左上延伸，极淡 -->
  <g stroke="#a8a39b" stroke-width="1" fill="none" opacity="0.18">  <!---->
    <!-- 主干 -->
    <line x1="1680" y1="880" x2="1100" y2="500" />
    <!-- 分支 -->
    <line x1="1100" y1="500" x2="600" y2="280" />
    <line x1="1100" y1="500" x2="700" y2="700" />
    <line x1="1100" y1="500" x2="1400" y2="300" />
    <!-- 二级分支 -->
    <line x1="600" y1="280" x2="320" y2="180" />
    <line x1="600" y1="280" x2="450" y2="420" />
    <line x1="1400" y1="300" x2="1550" y2="160" />
  </g>

  <!-- 节点 — 极淡的小圆点 -->
  <g fill="#d4d0c9" opacity="0.4">  <!---->
    <!-- 二级节点 -->
    <circle cx="320" cy="180" r="5" />
    <circle cx="450" cy="420" r="5" />
    <circle cx="1550" cy="160" r="5" />
    <!-- 一级节点 -->
    <circle cx="600" cy="280" r="7" />
    <circle cx="700" cy="700" r="7" />
    <circle cx="1400" cy="300" r="7" />
    <!-- 中心节点 -->
    <circle cx="1100" cy="500" r="9" />
  </g>

  <!-- 右下角 — 播放键，暖灰色调 -->
  <g transform="translate(1660, 850)">
    <!-- 圆角方形外框 -->
    <rect x="0" y="0" width="80" height="56" rx="14" ry="14"
          fill="none" stroke="#b8b0a8" stroke-width="1.5" opacity="0.4" />  <!---->
    <!-- 播放三角 -->
    <polygon points="35,18 35,38 50,28"
             fill="#b8b0a8" opacity="0.4" />  <!---->
  </g>
</svg>
